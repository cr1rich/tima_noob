<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квадраты и корни 10–30 — бесконечный тест</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(circle at 20% 0%, #2b3a67 0%, #141a2e 45%, #0b0e18 100%);
    color: #eef1f8;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
  }

  .app { width: 100%; max-width: 640px; }

  h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .4px;
    text-align: center;
    color: #93a7d6;
    margin: 0 0 16px;
    text-transform: uppercase;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }

  .stat {
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 12px;
    padding: 8px 4px 7px;
    text-align: center;
  }

  .stat span {
    display: block;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.15;
  }

  .stat small {
    display: block;
    font-size: 10px;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: #7f8db3;
    margin-top: 2px;
  }

  #statCorrect { color: #55d68b; }
  #statWrong   { color: #ff7b72; }
  #statStreak  { color: #ffd166; }
  #statBest    { color: #78b3ff; }

  .card {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 24px;
    padding: 24px 22px 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }

  .prompt {
    text-align: center;
    font-size: 13px;
    letter-spacing: .8px;
    text-transform: uppercase;
    color: #8b9ac4;
    margin-bottom: 6px;
    min-height: 17px;
  }

  .expr {
    text-align: center;
    min-height: 96px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
    font-weight: 700;
    line-height: 1;
  }

  .plain {
    font-size: clamp(54px, 16vw, 84px);
    color: #ffd166;
  }

  .secret-title {
    font-size: clamp(28px, 8vw, 42px);
    color: #ffd166;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 11px;
  }

  .option {
    position: relative;
    font-family: inherit;
    font-size: clamp(21px, 5.4vw, 27px);
    font-weight: 700;
    color: #eef1f8;
    background: rgba(255,255,255,.075);
    border: 1.5px solid rgba(255,255,255,.14);
    border-radius: 15px;
    padding: 18px 10px 16px;
    cursor: pointer;
    transition: background .16s, border-color .16s, transform .1s;
    user-select: none;
  }

  .option:hover:not(:disabled) {
    background: rgba(255,255,255,.16);
    border-color: rgba(255,255,255,.32);
  }

  .option:active:not(:disabled) { transform: scale(.97); }
  .option:disabled { cursor: default; }
  .option.dim { opacity: .45; }

  .option.correct {
    background: rgba(46, 190, 110, .28);
    border-color: #2ebe6e;
    color: #b7ffd8;
  }

  .option.wrong {
    background: rgba(224, 70, 70, .28);
    border-color: #e04646;
    color: #ffc4c0;
  }

  .key {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,.35);
    letter-spacing: .5px;
  }

  /* Поле ввода */
  .input-row {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
  }

  .answer-input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    color: #eef1f8;
    background: rgba(255,255,255,.075);
    border: 1.5px solid rgba(255,255,255,.14);
    border-radius: 15px;
    padding: 16px 10px;
    outline: none;
    transition: border-color .16s, background .16s;
  }

  .answer-input:focus {
    border-color: #78b3ff;
    background: rgba(120,179,255,.10);
  }

  .answer-input.correct {
    border-color: #2ebe6e;
    background: rgba(46,190,110,.18);
  }

  .answer-input.wrong {
    border-color: #e04646;
    background: rgba(224,70,70,.18);
  }

  .submit-btn {
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #0b0e18;
    background: #ffd166;
    border: none;
    border-radius: 15px;
    padding: 0 22px;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }

  .submit-btn:hover:not(:disabled) { opacity: .9; }
  .submit-btn:active:not(:disabled) { transform: scale(.97); }
  .submit-btn:disabled { opacity: .45; cursor: default; }

  .feedback {
    text-align: center;
    min-height: 24px;
    margin-top: 14px;
    font-size: 15px;
    font-weight: 600;
  }

  .feedback.ok  { color: #55d68b; }
  .feedback.err { color: #ff7b72; }

  .footer {
    display: flex;
    justify-content: center;
    margin-top: 16px;
  }

  .reset {
    font-family: inherit;
    font-size: 13px;
    letter-spacing: .5px;
    color: #8b9ac4;
    background: transparent;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px;
    padding: 9px 20px;
    cursor: pointer;
    transition: .15s;
  }

  .reset:hover { color: #eef1f8; border-color: rgba(255,255,255,.35); }

  @media (max-width: 380px) {
    .card { padding: 20px 14px 16px; border-radius: 18px; }
    .option { padding: 15px 6px 13px; }
    .submit-btn { padding: 0 16px; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="app">
  <h1>Квадраты и корни · 10–30</h1>

  <div class="stats">
    <div class="stat"><span id="statCorrect">0</span><small>верно</small></div>
    <div class="stat"><span id="statWrong">0</span><small>ошибок</small></div>
    <div class="stat"><span id="statStreak">0</span><small>серия</small></div>
    <div class="stat"><span id="statBest">0</span><small>рекорд</small></div>
  </div>

  <div class="card">
    <div class="prompt" id="prompt"></div>
    <div class="expr" id="expr"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div class="footer">
    <button class="reset" id="reset">Сбросить счёт</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const MIN = 10;
  const MAX = 30;

  const els = {
    prompt:   document.getElementById('prompt'),
    expr:     document.getElementById('expr'),
    options:  document.getElementById('options'),
    feedback: document.getElementById('feedback'),
    correct:  document.getElementById('statCorrect'),
    wrong:    document.getElementById('statWrong'),
    streak:   document.getElementById('statStreak'),
    best:     document.getElementById('statBest')
  };

  const state = {
    mode: 'rootMC', // rootMC | squareInput | secret
    n: 0,
    answer: 0,
    options: [],
    locked: false,
    timer: null,
    correct: 0,
    wrong: 0,
    streak: 0,
    best: 0
  };

  function randInt(a, b) {
    return a + Math.floor(Math.random() * (b - a + 1));
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildOptions(correct, near, min, max) {
    const set = new Set([correct]);

    for (const v of shuffle(near.slice())) {
      if (set.size >= 4) break;
      if (v >= min && v <= max && v !== correct) set.add(v);
    }

    let guard = 0;
    while (set.size < 4 && guard++ < 300) {
      const v = randInt(min, max);
      if (v !== correct) set.add(v);
    }

    return shuffle(Array.from(set));
  }

  function makeQuestion() {
    clearTimeout(state.timer);
    state.locked = false;

    // Секретный вопрос — шанс 1%
    if (Math.random() < 0.01) {
      makeSecretQuestion();
      return;
    }

    state.n = randInt(MIN, MAX);

    // 50 / 50:
    // 1) сверху квадрат числа, снизу варианты корня
    // 2) сверху число, снизу поле для ввода квадрата
    if (Math.random() < 0.5) {
      state.mode = 'rootMC';
      state.answer = state.n;
      state.options = buildOptions(
        state.n,
        [state.n - 1, state.n + 1, state.n - 2, state.n + 2, state.n - 3, state.n + 3],
        MIN, MAX
      );
      paintRootMC();
    } else {
      state.mode = 'squareInput';
      state.answer = state.n * state.n;
      paintSquareInput();
    }
  }

  function makeSecretQuestion() {
    state.mode = 'secret';
    state.answer = 'Кабельджон';
    state.options = shuffle(['Тимофей', 'Кабельджон']);
    paintSecret();
  }

  function paintRootMC() {
    els.prompt.textContent = 'Выбери корень числа';
    els.expr.innerHTML = '<span class="plain">' + (state.n * state.n) + '</span>';
    els.options.innerHTML = '';

    state.options.forEach(function (val, i) {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.dataset.val = val;
      btn.innerHTML = '<span class="key">' + (i + 1) + '</span>' + val;
      btn.addEventListener('click', function () { evaluate(val, btn); });
      els.options.appendChild(btn);
    });

    els.feedback.textContent = '';
    els.feedback.className = 'feedback';
  }

  function paintSquareInput() {
    els.prompt.textContent = 'Введи квадрат числа';
    els.expr.innerHTML = '<span class="plain">' + state.n + '</span>';
    els.options.innerHTML = '';

    const row = document.createElement('div');
    row.className = 'input-row';

    const input = document.createElement('input');
    input.className = 'answer-input';
    input.id = 'answerInput';
    input.type = 'text';
    input.inputMode = 'numeric';
    input.autocomplete = 'off';
    input.placeholder = 'Ответ';

    const btn = document.createElement('button');
    btn.className = 'submit-btn';
    btn.textContent = 'Проверить';

    function submit() {
      if (state.locked) return;
      const raw = input.value.trim().replace(',', '.');
      if (raw === '') {
        els.feedback.textContent = 'Введи число';
        els.feedback.className = 'feedback err';
        return;
      }
      const val = Number(raw);
      if (!Number.isFinite(val)) {
        els.feedback.textContent = 'Нужно ввести число';
        els.feedback.className = 'feedback err';
        return;
      }
      evaluate(val, btn, input);
    }

    btn.addEventListener('click', submit);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submit();
      }
    });

    row.appendChild(input);
    row.appendChild(btn);
    els.options.appendChild(row);

    els.feedback.textContent = '';
    els.feedback.className = 'feedback';

    setTimeout(function () { input.focus(); }, 30);
  }

  function paintSecret() {
    els.prompt.textContent = 'Секретный вопрос · шанс 1%';
    els.expr.innerHTML = '<span class="secret-title">Кто победит?</span>';
    els.options.innerHTML = '';

    state.options.forEach(function (val, i) {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.dataset.val = val;
      btn.innerHTML = '<span class="key">' + (i + 1) + '</span>' + val;
      btn.addEventListener('click', function () { evaluate(val, btn); });
      els.options.appendChild(btn);
    });

    els.feedback.textContent = '';
    els.feedback.className = 'feedback';
  }

  function evaluate(val, clickedBtn, inputEl) {
    if (state.locked) return;
    state.locked = true;

    const isRight = String(val) === String(state.answer);

    if (state.mode === 'squareInput') {
      if (inputEl) {
        inputEl.disabled = true;
        inputEl.classList.add(isRight ? 'correct' : 'wrong');
      }
      if (clickedBtn) clickedBtn.disabled = true;
    } else {
      Array.prototype.forEach.call(els.options.children, function (b) {
        if (!b.classList.contains('option')) return;
        b.disabled = true;
        const v = b.dataset.val;
        if (String(v) === String(state.answer)) {
          b.classList.add('correct');
        } else if (b === clickedBtn) {
          b.classList.add('wrong');
        } else {
          b.classList.add('dim');
        }
      });
    }

    if (isRight) {
      state.correct++;
      state.streak++;
      if (state.streak > state.best) state.best = state.streak;

      if (state.mode === 'secret') {
        els.feedback.textContent = 'Верно! Кабельджон побеждает.';
      } else {
        els.feedback.textContent = 'Верно! +1';
      }
      els.feedback.className = 'feedback ok';
    } else {
      state.wrong++;
      state.streak = 0;

      if (state.mode === 'secret') {
        els.feedback.textContent = 'Ошибка. Побеждает Кабельджон.';
      } else {
        els.feedback.textContent = 'Ошибка. Правильный ответ: ' + state.answer;
      }
      els.feedback.className = 'feedback err';
    }

    updateStats();

    state.timer = setTimeout(makeQuestion, isRight ? 750 : 1600);
  }

  function updateStats() {
    els.correct.textContent = state.correct;
    els.wrong.textContent   = state.wrong;
    els.streak.textContent  = state.streak;
    els.best.textContent    = state.best;
  }

  // Клавиши 1–4 для вариантов, Enter для поля ввода
  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;

    const idx = ['1', '2', '3', '4'].indexOf(e.key);
    if (idx === -1) return;

    const btn = els.options.children[idx];
    if (btn && btn.classList.contains('option') && !btn.disabled) {
      btn.click();
    }
  });

  document.getElementById('reset').addEventListener('click', function () {
    clearTimeout(state.timer);
    state.correct = 0;
    state.wrong = 0;
    state.streak = 0;
    state.best = 0;
    updateStats();
    makeQuestion();
  });

  updateStats();
  makeQuestion();
})();
</script>

</body>
</html>
